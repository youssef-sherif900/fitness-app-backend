name: fitness

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: app
  image: fitness-app:dev
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes: [ pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes: [ redisdata:/data ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    volumes:
      - seaweeddata:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports: [ "${S3_PORT:-8333}:8333" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:9333/cluster/status || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 30

  bucket-init:
    image: amazon/aws-cli:latest
    entrypoint: [ "/bin/sh", "/init.sh" ]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_BUCKET: ${AWS_BUCKET}
      AWS_ENDPOINT: http://seaweedfs:8333
    volumes: [ "./docker/bucket-init/init.sh:/init.sh:ro" ]
    depends_on:
      seaweedfs: { condition: service_healthy }
    restart: "no"

  migrate:
    <<: *app
    command: [ "sh", "-c", "php artisan migrate --force --seed" ]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  app:
    <<: *app
    healthcheck:
      test: [ "CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'" ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate: { condition: service_completed_successfully }
      bucket-init: { condition: service_completed_successfully }

  reverb:
    <<: *app
    command: [ "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080" ]
    ports: [ "${WS_PORT:-8081}:8080" ]
    depends_on:
      migrate: { condition: service_completed_successfully }

  queue:
    <<: *app
    command: [ "php", "artisan", "queue:work", "redis", "--queue=high,default", "--tries=3", "--backoff=10", "--sleep=1" ]
    depends_on:
      migrate: { condition: service_completed_successfully }
      bucket-init: { condition: service_completed_successfully }

  media:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: media
    image: fitness-media:dev
    env_file: .env
    restart: unless-stopped
    command: [ "php", "artisan", "queue:work", "redis", "--queue=media", "--tries=2", "--timeout=120", "--sleep=1" ]
    cpus: 1.0
    mem_limit: 768m
    depends_on:
      migrate: { condition: service_completed_successfully }
      bucket-init: { condition: service_completed_successfully }

  scheduler:
    <<: *app
    command: [ "php", "artisan", "schedule:work" ]
    depends_on:
      migrate: { condition: service_completed_successfully }

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/laravel_fastcgi.inc:/etc/nginx/laravel_fastcgi.inc:ro
    ports: [ "${API_PORT:-8080}:80" ]
    depends_on:
      app: { condition: service_healthy }
      reverb: { condition: service_started }
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    profiles: [ dev ]
    ports: [ "${MAILPIT_PORT:-8025}:8025" ]

  tests:
    <<: *app
    profiles: [ test ]
    restart: "no"
    environment:
      APP_ENV: testing
      DB_DATABASE: fitness_test
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: "null"
      MAIL_MAILER: array
    command: [ "sh", "-c", "PGPASSWORD=$$DB_PASSWORD psql -h $$DB_HOST -U $$DB_USERNAME -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='fitness_test'\" | grep -q 1 || PGPASSWORD=$$DB_PASSWORD psql -h $$DB_HOST -U $$DB_USERNAME -d postgres -c 'CREATE DATABASE fitness_test'; php artisan test" ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  seaweeddata:
