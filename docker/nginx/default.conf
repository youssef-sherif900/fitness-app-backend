limit_req_zone $binary_remote_addr zone=api_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_ip:10m rate=5r/s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;   # media goes direct to storage via signed URLs

    # WebSockets (Reverb, Pusher protocol)
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_pass http://reverb:8080;
    }

    location = /docs { return 302 /docs/api; }

    location ~ ^/api/v1/auth/ {
        limit_req zone=auth_ip burst=10 nodelay;
        include /etc/nginx/laravel_fastcgi.inc;
    }

    location / {
        limit_req zone=api_ip burst=40 nodelay;
        include /etc/nginx/laravel_fastcgi.inc;
    }
}
